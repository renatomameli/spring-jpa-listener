kotlin.code.style=official

# ======================================================
# Maven Central Publishing (for actual releases)
# ======================================================
# Do NOT commit these values to Git! Instead:
#   - Locally: in ~/.gradle/gradle.properties
#   - CI/CD: as GitHub Secrets + ORG_GRADLE_PROJECT_* env vars
#
# 1. Generate GPG key:  gpg --full-generate-key
# 2. Find key ID:       gpg --list-keys
# 3. Export private key:
#      gpg --armor --export-secret-keys <KEY-ID> | sed ':a;N;$!ba;s/\n/\\n/g'
# 4. Generate token at https://central.sonatype.com/
#
# signingInMemoryKeyId=
# signingInMemoryKeyPassword=<GPG-Passphrase>
# signingInMemoryKey=<-----BEGIN PGP PRIVATE KEY BLOCK-----\n...\n-----END PGP PRIVATE KEY BLOCK----->
# mavenCentralUsername=<token-username>
# mavenCentralPassword=<token-password>
