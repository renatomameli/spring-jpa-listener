kotlin.code.style=official

# ======================================================
# Maven Central Publishing (für echte Veröffentlichung)
# ======================================================
# Diese Werte NICHT ins Git committen! Stattdessen:
#   - Lokal: in ~/.gradle/gradle.properties
#   - CI/CD: als GitHub Secrets + ORG_GRADLE_PROJECT_* env vars
#
# 1. GPG-Key erzeugen: gpg --full-generate-key
# 2. Key-ID finden:    gpg --list-keys
# 3. Privaten Key exportieren:
#      gpg --armor --export-secret-keys <KEY-ID> | sed ':a;N;$!ba;s/\n/\\n/g'
# 4. User-Token auf https://central.sonatype.com/ generieren
#
# signingInMemoryKeyId=<KEY-ID letzte 8 Zeichen>
# signingInMemoryKeyPassword=<GPG-Passphrase>
# signingInMemoryKey=<-----BEGIN PGP PRIVATE KEY BLOCK-----\n...\n-----END PGP PRIVATE KEY BLOCK----->
# mavenCentralUsername=<token-username>
# mavenCentralPassword=<token-password>
